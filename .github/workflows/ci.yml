name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }} / Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: macos-latest
            node: 22
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build the QOI reference CLI (interop test)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential
          cc -O2 -o test/ref/qoi_ref_cli test/ref/qoi_ref_cli.c
          chmod +x test/ref/qoi_ref_cli

      - name: Run test suite
        run: npm test

      - name: Upload screenshots on failure (UI suite)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots-${{ matrix.os }}-${{ matrix.node }}
          path: docs/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7

  corpus:
    name: PSD corpus vs. independent reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          python3 -m pip install --quiet psd-tools pillow

      - name: Build and validate a feature-rich PSD
        run: npm run verify:psd

      - name: Check 30 real Photoshop files against psd-tools
        run: npm run verify:corpus:download
